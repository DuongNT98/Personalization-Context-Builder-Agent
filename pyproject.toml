[project]
name = "cmn-c1-036"
version = "0.1.0"
description = "PersonalizationContextBuilderAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# provided by CI, either via a local stub path or installed from the internal
# package registry depending on repo generation. Pinning it here would make
# `pip install -e .` fail because it is not resolvable from the default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

# The SDK (framework/shared) ships no py.typed marker (PEP 561), so mypy cannot
# analyze it and treats every import as Any. Strict mode's disallow_subclassing_any
# then flags every node/graph class, which inherits from that Any-typed base with
# no real signal to give until the SDK ships stubs.
[[tool.mypy.overrides]]
module = ["framework.*", "shared.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.*"]
disallow_subclassing_any = false
