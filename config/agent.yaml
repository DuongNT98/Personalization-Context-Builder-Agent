# Agent Manifest — AgentRegistry entry point
# AgentRegistry (mediator/registry/agent_registry.py) reads every key below at
# ROOT level — do NOT nest keys under an `agent:` block. That nested shape is
# invisible to the registry (falls back to defaults / KeyErrors).
id: "CMN-C1-036"
name: "PersonalizationContextBuilderAgent"
namespace: "cmn-c1-036"
version: "0.1.0"
enabled: true
category: "Cat 1"
# Static generation contract — main's interest/price-sensitivity/channel
# inference calls a real LLM (Azure OpenAI); recency/frequency/engagement
# scoring stays deterministic time-decay math (see docs/02_design.md §1.1).
generation_mode: "llm"  # deterministic | llm
industry: "CMN"

# Opaque compatibility metadata. It is not an inheritance selector or gate input.
base_type: "AgentBaseGraph"

# Entry point — single dotted import path (module.Class), NOT split module:/class:.
# AgentRegistry does `manifest["class"].rsplit(".", 1)` to get (module, class_name).
class: "src.graph.graph.PersonalizationContextBuilderGraph"

# Security
required_trust_level: "VERIFIED_EXTERNAL"

# Compile-time gates (AgentRegistry._compile_and_cache) — declare every secret/extra
# actually used, or the agent loads with those checks silently disabled.
# AZURE_OPENAI_API_KEY / AZURE_OPENAI_ENDPOINT / AZURE_OPENAI_DEPLOYMENT: all
# three resolved via ctx.secrets.require(...) inside MainNode.execute()
# (per-invocation, not cached — src/nodes/main_node.py). None of it lives in
# config/config.yaml — endpoint and deployment are secrets here, not runtime
# config, even though they are not credentials by themselves.
# TREASURE_DATA_API_KEY is still deliberately NOT declared: v1 ships a mock CDP
# writer (src/nodes/post_process_node.py::cdp_targets() only returns sink names —
# no ctx.secrets.require() call for it exists anywhere in src/). Add it back only
# when a live CDP write lands and the key is actually configured.
requires:
  secrets: ["AZURE_OPENAI_API_KEY", "AZURE_OPENAI_ENDPOINT", "AZURE_OPENAI_DEPLOYMENT"]
  extras: ["openai"]  # AzureOpenAIClient wraps langchain_openai.ChatOpenAI

# generation_mode is deployment identity, not a tunable provider setting. Runtime
# parameters (max_retry, timeout_s, event_types, scoring_weights, cdp_integration,
# context_ttl_hours, top_n_topics) live in config/config.yaml — AgentRegistry
# loads that file separately and passes it as Graph(config=...). Do NOT put them
# here.
